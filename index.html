<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blackjack 21 VIP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --felt-color: #0d3b24;
            --felt-radial: radial-gradient(circle at center, #155734 0%, #082215 100%);
            --gold-gradient: linear-gradient(135deg, #ffe066 0%, #f39c12 50%, #b7791f 100%);
            --card-width: 68px;
            --card-height: 98px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--felt-radial);
            color: #fff;
            margin: 0;
            padding: 12px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            user-select: none;
        }

        /* Верхняя панель */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .brand {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .balance-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 14px;
            border-radius: 50px;
            border: 1px solid #f39c12;
            font-weight: 800;
            color: #ffd700;
            font-size: 15px;
        }

        /* Игровое поле */
        .casino-table {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 10px 0;
            position: relative;
        }

        .hand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.8);
        }

        .score-badge {
            background: var(--gold-gradient);
            color: #000;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 900;
        }

        /* Карты */
        .cards-row {
            display: flex;
            justify-content: center;
            min-height: var(--card-height);
            perspective: 1000px;
            padding: 0 20px;
        }

        .card-wrapper {
            width: var(--card-width);
            height: var(--card-height);
            margin-left: -25px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s ease-out;
            animation: dealCard 0.4s ease-out forwards;
        }

        .card-wrapper:first-child { margin-left: 0; }

        @keyframes dealCard {
            0% { transform: translateY(-150px) rotate(-10deg) scale(0.5); opacity: 0; }
            100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            backface-visibility: hidden;
            box-shadow: -2px 4px 12px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
            box-sizing: border-box;
            background: #fff;
            border: 1px solid #ddd;
        }

        .card-back {
            background: linear-gradient(135deg, #b31217 0%, #e52d27 100%);
            border: 2px solid #fff;
            transform: rotateY(180deg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-back::after {
            content: "♠";
            font-size: 28px;
            color: rgba(255,255,255,0.3);
        }

        .card-wrapper.flipped {
            transform: rotateY(180deg);
        }

        .card-face.red { color: #e74c3c; }
        .card-face.black { color: #2c3e50; }

        .card-top { font-size: 13px; font-weight: 800; line-height: 1; }
        .card-suit-center { font-size: 26px; align-self: center; }
        .card-bottom { font-size: 13px; font-weight: 800; align-self: flex-end; transform: rotate(180deg); }

        /* Центр стола (Банк и Статусы) */
        .table-center {
            text-align: center;
            min-height: 40px;
        }

        .status-banner {
            font-size: 16px;
            font-weight: 800;
            color: #ffd700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.98); opacity: 0.8; }
            100% { transform: scale(1.02); opacity: 1; }
        }

        .current-bet {
            font-size: 13px;
            color: #2ecc71;
            font-weight: 700;
            margin-top: 4px;
        }

        /* Панель фишек */
        .chips-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .chip {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px dashed #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 6px 10px rgba(0,0,0,0.4);
            transition: transform 0.15s, border-color 0.2s;
        }

        .chip:active { transform: scale(0.9); }
        .chip.c-10 { background: radial-gradient(#e74c3c, #962d22); color: #fff; }
        .chip.c-50 { background: radial-gradient(#3498db, #1d6fa5); color: #fff; }
        .chip.c-100 { background: radial-gradient(#f1c40f, #f39c12); color: #000; }
        .chip.c-500 { background: radial-gradient(#9b59b6, #6c3483); color: #fff; }
        .chip.selected { border: 3px solid #ffd700; transform: translateY(-4px); }

        /* Кнопки действий */
        .controls-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-weight: 800;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }

        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .btn-action:disabled { opacity: 0.4; filter: grayscale(1); cursor: not-allowed; }

        .btn-deal { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .btn-hit { background: linear-gradient(135deg, #f39c12, #d35400); }
        .btn-stand { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .btn-double { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
    </style>
</head>
<body>

    <!-- Верхняя панель игрока -->
    <div class="top-bar">
        <div class="brand">21 CASINO</div>
        <div class="balance-chip">
            <span>⭐</span> <span id="balance">1000</span>
        </div>
    </div>

    <!-- Казино Стол -->
    <div class="casino-table">
        <!-- Дилер -->
        <div class="hand-section">
            <div class="player-info">
                <span>ДИЛЕР</span>
                <span class="score-badge" id="dealer-score">0</span>
            </div>
            <div class="cards-row" id="dealer-cards"></div>
        </div>

        <!-- Центр (Банк / Статус) -->
        <div class="table-center">
            <div class="status-banner" id="status">СДЕЛАЙТЕ СТАВКУ</div>
            <div class="current-bet" id="bet-display">Ставка: 0 ⭐</div>
        </div>

        <!-- Игрок -->
        <div class="hand-section">
            <div class="cards-row" id="player-cards"></div>
            <div class="player-info">
                <span>ВЫ</span>
                <span class="score-badge" id="player-score">0</span>
            </div>
        </div>
    </div>

    <!-- Управление и Фишки -->
    <div class="controls-area">
        <!-- Выбор фишек для ставки -->
        <div class="chips-selector" id="chips-bar">
            <div class="chip c-10" onclick="addBet(10)">10</div>
            <div class="chip c-50" onclick="addBet(50)">50</div>
            <div class="chip c-100" onclick="addBet(100)">100</div>
            <div class="chip c-500" onclick="addBet(500)">500</div>
        </div>

        <!-- Игровые кнопки -->
        <div class="btn-group" id="bet-controls">
            <button class="btn-action btn-stand" onclick="resetBet()">Сброс</button>
            <button class="btn-action btn-deal" id="deal-btn" onclick="startGame()">Раздать</button>
        </div>

        <div class="btn-group" id="game-controls" style="display: none;">
            <button class="btn-action btn-hit" id="hit-btn" onclick="hit()">Ещё</button>
            <button class="btn-action btn-double" id="double-btn" onclick="doubleDown()">x2 Удвоить</button>
            <button class="btn-action btn-stand" id="stand-btn" onclick="stand()">Хватит</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Аудио эффекты на синтезаторе Web Audio API (без сторонних файлов)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'chip') {
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
                } else if (type === 'card') {
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.08);
                } else if (type === 'win') {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch(e) {}
        }

        const SUITS = ['♠', '♥', '♦', '♣'];
        const VALUES = [
            { name: '6', val: 6 }, { name: '7', val: 7 }, { name: '8', val: 8 },
            { name: '9', val: 9 }, { name: '10', val: 10 }, { name: 'В', val: 2 },
            { name: 'Д', val: 3 }, { name: 'К', val: 4 }, { name: 'Т', val: 11 }
        ];

        let balance = 1000;
        let currentBet = 0;
        let deck = [];
        let playerHand = [];
        let dealerHand = [];
        let isPlaying = false;

        function haptic(style = 'light') {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred(style);
        }

        function addBet(amount) {
            if (isPlaying) return;
            if (balance >= amount) {
                balance -= amount;
                currentBet += amount;
                updateBalanceUI();
                playSound('chip');
                haptic('medium');
            } else {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        }

        function resetBet() {
            if (isPlaying) return;
            balance += currentBet;
            currentBet = 0;
            updateBalanceUI();
            haptic('light');
        }

        function updateBalanceUI() {
            document.getElementById('balance').innerText = balance;
            document.getElementById('bet-display').innerText = `Ставка: ${currentBet} ⭐`;
            document.getElementById('deal-btn').disabled = currentBet === 0;
        }

        function createDeck() {
            deck = [];
            for (let suit of SUITS) {
                for (let val of VALUES) {
                    deck.push({ ...val, suit });
                }
            }
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function calculateScore(hand) {
            let score = hand.reduce((acc, card) => acc + card.val, 0);
            let aces = hand.filter(c => c.name === 'Т').length;
            while (score > 21 && aces > 0) {
                score -= 10;
                aces--;
            }
            return score;
        }

        function createCardHTML(card, isHidden = false) {
            const isRed = card.suit === '♥' || card.suit === '♦';
            return `
                <div class="card-wrapper ${isHidden ? 'flipped' : ''}">
                    <div class="card-face ${isRed ? 'red' : 'black'}">
                        <div class="card-top">${card.name}<br>${card.suit}</div>
                        <div class="card-suit-center">${card.suit}</div>
                        <div class="card-bottom">${card.name}<br>${card.suit}</div>
                    </div>
                    <div class="card-face card-back"></div>
                </div>
            `;
        }

        function renderHands(hideDealerSecond = true) {
            const pCardsEl = document.getElementById('player-cards');
            const dCardsEl = document.getElementById('dealer-cards');

            pCardsEl.innerHTML = playerHand.map(c => createCardHTML(c)).join('');
            
            if (dealerHand.length > 0) {
                if (hideDealerSecond && isPlaying) {
                    dCardsEl.innerHTML = createCardHTML(dealerHand[0]) + createCardHTML(dealerHand[1], true);
                    document.getElementById('dealer-score').innerText = dealerHand[0].val;
                } else {
                    dCardsEl.innerHTML = dealerHand.map(c => createCardHTML(c)).join('');
                    document.getElementById('dealer-score').innerText = calculateScore(dealerHand);
                }
            }

            document.getElementById('player-score').innerText = calculateScore(playerHand);
        }

        async function startGame() {
            if (currentBet === 0 || isPlaying) return;

            isPlaying = true;
            createDeck();
            playerHand = [];
            dealerHand = [];

            document.getElementById('chips-bar').style.opacity = '0.4';
            document.getElementById('chips-bar').style.pointerEvents = 'none';
            document.getElementById('bet-controls').style.display = 'none';
            document.getElementById('game-controls').style.display = 'flex';
            document.getElementById('double-btn').disabled = balance < currentBet;
            document.getElementById('status').innerText = 'ВАШ ХОД';

            // Раздача с паузами для красивой анимации
            playerHand.push(deck.pop()); renderHands(); playSound('card'); await sleep(250);
            dealerHand.push(deck.pop()); renderHands(); playSound('card'); await sleep(250);
            playerHand.push(deck.pop()); renderHands(); playSound('card'); await sleep(250);
            dealerHand.push(deck.pop()); renderHands(); playSound('card');

            checkInitialState();
        }

        function checkInitialState() {
            const pScore = calculateScore(playerHand);
            // 2 Туза = Золотые 21
            if (playerHand.length === 2 && playerHand[0].name === 'Т' && playerHand[1].name === 'Т') {
                endGame('🏆 ЗОЛОТЫЕ 21! ВЫИГРЫШ 3x!', 3);
            } else if (pScore === 21) {
                stand();
            }
        }

        async function hit() {
            if (!isPlaying) return;
            haptic('light');
            playSound('card');

            playerHand.push(deck.pop());
            renderHands();

            document.getElementById('double-btn').disabled = true;

            const pScore = calculateScore(playerHand);
            if (pScore > 21) {
                endGame('💥 ПЕРЕБОР! ВЫ ПРОИГРАЛИ', 0);
            } else if (pScore === 21) {
                stand();
            }
        }

        async function doubleDown() {
            if (!isPlaying || balance < currentBet) return;
            balance -= currentBet;
            currentBet *= 2;
            updateBalanceUI();
            haptic('heavy');

            playerHand.push(deck.pop());
            renderHands();

            if (calculateScore(playerHand) > 21) {
                endGame('💥 ПЕРЕБОР! ВЫ ПРОИГРАЛИ', 0);
            } else {
                await stand();
            }
        }

        async function stand() {
            if (!isPlaying) return;
            isPlaying = false;
            haptic('medium');

            // Открываем скрытую карту дилера
            renderHands(false);
            playSound('card');
            await sleep(500);

            // Дилер берет карты до 17
            while (calculateScore(dealerHand) < 17) {
                dealerHand.push(deck.pop());
                renderHands(false);
                playSound('card');
                await sleep(500);
            }

            const pScore = calculateScore(playerHand);
            const dScore = calculateScore(dealerHand);

            if (dScore > 21) {
                endGame('🎉 ДИЛЕР ПЕРЕБРАЛ! ВЫИГРЫШ!', 2);
            } else if (pScore > dScore) {
                endGame('🎉 ВЫ ВЫИГРАЛИ!', 2);
            } else if (pScore < dScore) {
                endGame('❌ ДИЛЕР ПОБЕДИЛ', 0);
            } else {
                endGame('🤝 НИЧЬЯ! СТАВКА ВОЗВРАЩЕНА', 1);
            }
        }

        function endGame(msg, multiplier) {
            isPlaying = false;
            document.getElementById('status').innerText = msg;

            const winAmount = currentBet * multiplier;
            balance += winAmount;
            currentBet = 0;

            if (multiplier > 1) {
                playSound('win');
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else if (multiplier === 0) {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }

            updateBalanceUI();

            setTimeout(() => {
                document.getElementById('chips-bar').style.opacity = '1';
                document.getElementById('chips-bar').style.pointerEvents = 'auto';
                document.getElementById('bet-controls').style.display = 'flex';
                document.getElementById('game-controls').style.display = 'none';
            }, 1000);
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        updateBalanceUI();
    </script>
</body>
</html>
