<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>21 в стиле Duolingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #ffffff;
            --color-card-bg: #f7f7f7;
            --color-text: #3c3c3c;
            --color-gray: #e5e5e5;
            --color-gray-dark: #afafaf;
            
            --color-green: #58cc02;
            --color-green-shadow: #58a700;
            
            --color-blue: #1cb0f6;
            --color-blue-shadow: #1899d6;
            
            --color-orange: #ff9600;
            --color-orange-shadow: #cc7a00;
            
            --color-red: #ff4b4b;
            --color-red-shadow: #ea2b2b;
            
            --color-purple: #ce82ff;
            --color-purple-shadow: #b365e8;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            margin: 0;
            padding: 16px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            user-select: none;
        }

        /* Шапка */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            border-bottom: 2px solid var(--color-gray);
            padding-bottom: 12px;
        }

        .brand {
            font-weight: 900;
            font-size: 20px;
            color: var(--color-green);
            letter-spacing: 0.5px;
        }

        .balance-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fff8e1;
            border: 2px solid #ffe082;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 900;
            color: #ffa000;
            font-size: 16px;
        }

        /* Игровое поле */
        .game-board {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 10px 0;
        }

        .section-box {
            background: var(--color-card-bg);
            border: 2px solid var(--color-gray);
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
            font-size: 14px;
            color: var(--color-gray-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-badge {
            background: var(--color-gray);
            color: var(--color-text);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 13px;
        }

        /* Карты */
        .cards-container {
            display: flex;
            gap: 8px;
            min-height: 84px;
            overflow-x: auto;
            align-items: center;
        }

        .duo-card {
            width: 56px;
            height: 80px;
            background: #ffffff;
            border: 2px solid var(--color-gray);
            border-bottom: 5px solid var(--color-gray);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
            font-weight: 900;
            font-size: 15px;
            flex-shrink: 0;
            animation: popCard 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transition: transform 0.2s;
        }

        .duo-card.red { color: var(--color-red); }
        .duo-card.black { color: #3c3c3c; }
        .duo-card.hidden {
            background: linear-gradient(135deg, var(--color-blue), var(--color-blue-shadow));
            border-color: var(--color-blue-shadow);
            color: transparent;
        }

        .card-center {
            font-size: 20px;
            align-self: center;
        }

        @keyframes popCard {
            0% { transform: scale(0.3) translateY(30px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* Центр (Статус) */
        .status-container {
            text-align: center;
            padding: 4px;
        }

        .status-text {
            font-weight: 900;
            font-size: 18px;
            color: var(--color-text);
        }

        .bet-subtext {
            font-weight: 800;
            font-size: 14px;
            color: var(--color-green);
            margin-top: 2px;
        }

        /* Панель фишек (выбор ставки) */
        .chips-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .chip-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
            transition: transform 0.1s, filter 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .chip-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.15);
        }

        .chip-10 { background: var(--color-blue); border-bottom: 4px solid var(--color-blue-shadow); }
        .chip-50 { background: var(--color-orange); border-bottom: 4px solid var(--color-orange-shadow); }
        .chip-100 { background: var(--color-red); border-bottom: 4px solid var(--color-red-shadow); }
        .chip-500 { background: var(--color-purple); border-bottom: 4px solid var(--color-purple-shadow); }

        /* Кнопки в стиле Duolingo (Главные CTA) */
        .actions-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        .duo-btn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 16px;
            font-weight: 900;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        /* Эффект реального нажатия кнопки вниз */
        .duo-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.1);
        }

        .duo-btn:disabled {
            background-color: var(--color-gray) !important;
            border-bottom: 4px solid var(--color-gray-dark) !important;
            color: var(--color-gray-dark) !important;
            cursor: not-allowed;
            transform: translateY(4px) !important;
            box-shadow: 0 0 0 !important;
        }

        .btn-green {
            background-color: var(--color-green);
            border-bottom: 4px solid var(--color-green-shadow);
        }

        .btn-blue {
            background-color: var(--color-blue);
            border-bottom: 4px solid var(--color-blue-shadow);
        }

        .btn-red {
            background-color: var(--color-red);
            border-bottom: 4px solid var(--color-red-shadow);
        }

        .btn-orange {
            background-color: var(--color-orange);
            border-bottom: 4px solid var(--color-orange-shadow);
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="top-bar">
        <div class="brand">🦉 21 ДУО</div>
        <div class="balance-pill">
            <span>XP</span> <span id="balance">1000</span>
        </div>
    </div>

    <!-- Игровой стол -->
    <div class="game-board">
        <!-- Блок дилера -->
        <div class="section-box">
            <div class="section-header">
                <span>Дилер</span>
                <span class="score-badge" id="dealer-score">0</span>
            </div>
            <div class="cards-container" id="dealer-cards"></div>
        </div>

        <!-- Статус раунда -->
        <div class="status-container">
            <div class="status-text" id="status">Сделайте ставку!</div>
            <div class="bet-subtext" id="bet-display">Ставка: 0 XP</div>
        </div>

        <!-- Блок игрока -->
        <div class="section-box">
            <div class="section-header">
                <span>Игрок</span>
                <span class="score-badge" id="player-score">0</span>
            </div>
            <div class="cards-container" id="player-cards"></div>
        </div>
    </div>

    <!-- Панель управления -->
    <div class="actions-container">
        <!-- Выбор фишек -->
        <div class="chips-row" id="chips-bar">
            <button class="chip-btn chip-10" onclick="addBet(10)">10</button>
            <button class="chip-btn chip-50" onclick="addBet(50)">50</button>
            <button class="chip-btn chip-100" onclick="addBet(100)">100</button>
            <button class="chip-btn chip-500" onclick="addBet(500)">500</button>
        </div>

        <!-- Кнопки старта и действий -->
        <div class="btn-row" id="bet-controls">
            <button class="duo-btn btn-red" onclick="resetBet()">Сброс</button>
            <button class="duo-btn btn-green" id="deal-btn" onclick="startGame()" disabled>Играть</button>
        </div>

        <div class="btn-row" id="game-controls" style="display: none;">
            <button class="duo-btn btn-orange" onclick="hit()">Ещё</button>
            <button class="duo-btn btn-blue" id="double-btn" onclick="doubleDown()">Удвоить</button>
            <button class="duo-btn btn-red" onclick="stand()">Хватит</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const SUITS = ['♠', '♥', '♦', '♣'];
        const VALUES = [
            { name: '6', val: 6 }, { name: '7', val: 7 }, { name: '8', val: 8 },
            { name: '9', val: 9 }, { name: '10', val: 10 }, { name: 'В', val: 2 },
            { name: 'Д', val: 3 }, { name: 'К', val: 4 }, { name: 'Т', val: 11 }
        ];

        let balance = 1000;
        let currentBet = 0;
        let deck = [];
        let playerHand = [];
        let dealerHand = [];
        let isPlaying = false;

        function haptic(style = 'light') {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred(style);
        }

        function addBet(amount) {
            if (isPlaying) return;
            if (balance >= amount) {
                balance -= amount;
                currentBet += amount;
                updateUI();
                haptic('medium');
            } else {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        }

        function resetBet() {
            if (isPlaying) return;
            balance += currentBet;
            currentBet = 0;
            updateUI();
            haptic('light');
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance;
            document.getElementById('bet-display').innerText = `Ставка: ${currentBet} XP`;
            document.getElementById('deal-btn').disabled = currentBet === 0;
        }

        function createDeck() {
            deck = [];
            for (let suit of SUITS) {
                for (let val of VALUES) {
                    deck.push({ ...val, suit });
                }
            }
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function calculateScore(hand) {
            let score = hand.reduce((acc, card) => acc + card.val, 0);
            let aces = hand.filter(c => c.name === 'Т').length;
            while (score > 21 && aces > 0) {
                score -= 10;
                aces--;
            }
            return score;
        }

        function renderCardHTML(card, isHidden = false) {
            if (isHidden) {
                return `<div class="duo-card hidden">?</div>`;
            }
            const isRed = card.suit === '♥' || card.suit === '♦';
            return `
                <div class="duo-card ${isRed ? 'red' : 'black'}">
                    <div>${card.name}</div>
                    <div class="card-center">${card.suit}</div>
                    <div style="transform: rotate(180deg);">${card.name}</div>
                </div>
            `;
        }

        function renderHands(hideDealerSecond = true) {
            document.getElementById('player-cards').innerHTML = playerHand.map(c => renderCardHTML(c)).join('');
            
            if (dealerHand.length > 0) {
                if (hideDealerSecond && isPlaying) {
                    document.getElementById('dealer-cards').innerHTML = renderCardHTML(dealerHand[0]) + renderCardHTML(null, true);
                    document.getElementById('dealer-score').innerText = dealerHand[0].val;
                } else {
                    document.getElementById('dealer-cards').innerHTML = dealerHand.map(c => renderCardHTML(c)).join('');
                    document.getElementById('dealer-score').innerText = calculateScore(dealerHand);
                }
            }
            document.getElementById('player-score').innerText = calculateScore(playerHand);
        }

        async function startGame() {
            if (currentBet === 0 || isPlaying) return;

            isPlaying = true;
            createDeck();
            playerHand = [];
            dealerHand = [];

            document.getElementById('chips-bar').style.display = 'none';
            document.getElementById('bet-controls').style.display = 'none';
            document.getElementById('game-controls').style.display = 'flex';
            document.getElementById('double-btn').disabled = balance < currentBet;
            document.getElementById('status').innerText = 'Твой ход!';

            playerHand.push(deck.pop()); renderHands(); haptic('light'); await sleep(250);
            dealerHand.push(deck.pop()); renderHands(); haptic('light'); await sleep(250);
            playerHand.push(deck.pop()); renderHands(); haptic('light'); await sleep(250);
            dealerHand.push(deck.pop()); renderHands(); haptic('light');

            if (calculateScore(playerHand) === 21) {
                endGame('✨ Идеальные 21!', 2.5);
            }
        }

        async function hit() {
            if (!isPlaying) return;
            haptic('medium');
            playerHand.push(deck.pop());
            renderHands();
            document.getElementById('double-btn').disabled = true;

            if (calculateScore(playerHand) > 21) {
                endGame('💥 Перебор!', 0);
            }
        }

        async function doubleDown() {
            if (!isPlaying || balance < currentBet) return;
            balance -= currentBet;
            currentBet *= 2;
            updateUI();
            haptic('heavy');

            playerHand.push(deck.pop());
            renderHands();

            if (calculateScore(playerHand) > 21) {
                endGame('💥 Перебор при удвоении!', 0);
            } else {
                await stand();
            }
        }

        async function stand() {
            if (!isPlaying) return;
            isPlaying = false;
            haptic('medium');

            renderHands(false);
            await sleep(400);

            while (calculateScore(dealerHand) < 17) {
                dealerHand.push(deck.pop());
                renderHands(false);
                haptic('light');
                await sleep(400);
            }

            const pScore = calculateScore(playerHand);
            const dScore = calculateScore(dealerHand);

            if (dScore > 21) {
                endGame('🎉 У дилера перебор! Победа!', 2);
            } else if (pScore > dScore) {
                endGame('🎉 Победа по очкам!', 2);
            } else if (pScore < dScore) {
                endGame('😢 Победа дилера', 0);
            } else {
                endGame('🤝 Ничья!', 1);
            }
        }

        function endGame(msg, multiplier) {
            isPlaying = false;
            document.getElementById('status').innerText = msg;

            const winAmount = currentBet * multiplier;
            balance += winAmount;
            currentBet = 0;

            if (multiplier > 1) {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else if (multiplier === 0) {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }

            updateUI();

            setTimeout(() => {
                document.getElementById('chips-bar').style.display = 'flex';
                document.getElementById('bet-controls').style.display = 'flex';
                document.getElementById('game-controls').style.display = 'none';
                document.getElementById('status').innerText = 'Сделайте ставку!';
            }, 1500);
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        updateUI();
    </script>
</body>
</html>
