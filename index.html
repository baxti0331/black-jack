<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Карточная игра 21</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1a472a;
            --card-bg: #ffffff;
            --text-color: #ffffff;
            --accent-color: #f39c12;
            --btn-red: #e74c3c;
            --btn-green: #2ecc71;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 90vh;
            box-sizing: border-box;
            user-select: none;
        }

        .header {
            text-align: center;
        }

        .score-board {
            font-size: 18px;
            margin-bottom: 8px;
            background: rgba(0,0,0,0.2);
            padding: 8px 16px;
            border-radius: 12px;
            display: inline-block;
        }

        .table {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 20px 0;
        }

        .hand-container {
            background: rgba(0,0,0,0.15);
            padding: 12px;
            border-radius: 16px;
        }

        .hand-title {
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .cards {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            min-height: 80px;
        }

        .card {
            width: 55px;
            height: 80px;
            background: var(--card-bg);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            box-sizing: border-box;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            animation: popIn 0.2s ease-out;
        }

        .card.red { color: #d63031; }
        .card.black { color: #2d3436; }

        .card .suit {
            font-size: 18px;
            align-self: center;
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-direction: column;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: #fff;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-hit { background-color: var(--accent-color); }
        .btn-stand { background-color: var(--btn-red); }
        .btn-restart { background-color: var(--btn-green); width: 100%; }

        .status-msg {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            min-height: 28px;
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🃏 Игра «21»</h2>
        <div class="score-board">Баланс: <span id="balance">1000</span> ⭐</div>
    </div>

    <div class="status-msg" id="status">Нажмите «Еще», чтобы взять карту</div>

    <div class="table">
        <!-- Рука Дилера -->
        <div class="hand-container">
            <div class="hand-title">Дилер (<span id="dealer-score">0</span>)</div>
            <div class="cards" id="dealer-cards"></div>
        </div>

        <!-- Рука Игрока -->
        <div class="hand-container">
            <div class="hand-title">Игрок (<span id="player-score">0</span>)</div>
            <div class="cards" id="player-cards"></div>
        </div>
    </div>

    <div class="controls">
        <div class="row">
            <button class="btn-hit" id="hit-btn" onclick="hit()">Взять (+1)</button>
            <button class="btn-stand" id="stand-btn" onclick="stand()">Хватит</button>
        </div>
        <button class="btn-restart" id="restart-btn" onclick="startNewGame()" style="display: none;">Новая игра</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран Telegram

        const SUITS = ['♠', '♥', '♦', '♣'];
        const VALUES = [
            { name: '6', val: 6 },
            { name: '7', val: 7 },
            { name: '8', val: 8 },
            { name: '9', val: 9 },
            { name: '10', val: 10 },
            { name: 'В', val: 2 },
            { name: 'Д', val: 3 },
            { name: 'К', val: 4 },
            { name: 'Т', val: 11 } // Туз = 11 (или 1 если перебор)
        ];

        let deck = [];
        let playerHand = [];
        let dealerHand = [];
        let gameOver = false;

        function createDeck() {
            deck = [];
            for (let suit of SUITS) {
                for (let val of VALUES) {
                    deck.push({ ...val, suit });
                }
            }
            // Перемешивание (Fisher-Yates)
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function calculateScore(hand) {
            let score = hand.reduce((acc, card) => acc + card.val, 0);
            let aces = hand.filter(c => c.name === 'Т').length;
            
            // Если перебор, тузы считаются за 1 вместо 11
            while (score > 21 && aces > 0) {
                score -= 10;
                aces--;
            }
            return score;
        }

        function renderCard(card) {
            const isRed = card.suit === '♥' || card.suit === '♦';
            return `
                <div class="card ${isRed ? 'red' : 'black'}">
                    <div>${card.name}</div>
                    <div class="suit">${card.suit}</div>
                    <div style="text-align: right;">${card.name}</div>
                </div>
            `;
        }

        function updateUI() {
            document.getElementById('player-cards').innerHTML = playerHand.map(renderCard).join('');
            document.getElementById('dealer-cards').innerHTML = dealerHand.map(renderCard).join('');
            
            document.getElementById('player-score').innerText = calculateScore(playerHand);
            document.getElementById('dealer-score').innerText = calculateScore(dealerHand);
        }

        function startNewGame() {
            createDeck();
            playerHand = [deck.pop(), deck.pop()];
            dealerHand = [deck.pop()];
            gameOver = false;

            document.getElementById('status').innerText = 'Твой ход!';
            document.getElementById('hit-btn').disabled = false;
            document.getElementById('stand-btn').disabled = false;
            document.getElementById('restart-btn').style.display = 'none';

            updateUI();
            checkAutoWin();
        }

        function checkAutoWin() {
            const pScore = calculateScore(playerHand);
            // "Золотое очко" — 2 туза = 21 сразу
            if (playerHand.length === 2 && playerHand[0].name === 'Т' && playerHand[1].name === 'Т') {
                endGame('🎉 Золотые 21! Вы выиграли!');
            } else if (pScore === 21) {
                endGame('🎉 21! Вы выиграли!');
            }
        }

        function hit() {
            if (gameOver) return;
            
            // Вибрация Telegram при доборе карты
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

            playerHand.push(deck.pop());
            updateUI();

            const pScore = calculateScore(playerHand);
            if (pScore > 21) {
                endGame('💥 Перебор! Вы проиграли.');
            } else if (pScore === 21) {
                stand();
            }
        }

        function stand() {
            if (gameOver) return;

            // Ход дилера (дилер добирает, пока у него меньше 17)
            while (calculateScore(dealerHand) < 17) {
                dealerHand.push(deck.pop());
            }

            updateUI();

            const pScore = calculateScore(playerHand);
            const dScore = calculateScore(dealerHand);

            if (dScore > 21) {
                endGame('🎉 У дилера перебор! Вы выиграли!');
            } else if (pScore > dScore) {
                endGame('🎉 Вы выиграли по очкам!');
            } else if (pScore < dScore) {
                endGame('❌ Дилер выиграл.');
            } else {
                endGame('🤝 Ничья!');
            }
        }

        function endGame(msg) {
            gameOver = true;
            document.getElementById('status').innerText = msg;
            document.getElementById('hit-btn').disabled = true;
            document.getElementById('stand-btn').disabled = true;
            document.getElementById('restart-btn').style.display = 'block';

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        // Старт игры при загрузке
        startNewGame();
    </script>
</body>
</html>
